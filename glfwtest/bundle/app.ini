# Starlight app bundle: GLFW Test, GLFW on PeOS (the Rift Ascend port,
# phase C): a window, OpenGL 4.5 on the GPU through GLFW and glad, the
# keyboard and the mouse. It needs "gpu"; fs.read only for its own bundle;
# shm: the window's pixels.
title=GLFW Test
category=strumenti
dock=yes
exec=./app.bin
args=
capabilities=gpu, fs.read, shm
paths=/system/apps/glfwtest.app:r
icon=res:icon
width=800
height=600
min_width=200
min_height=150

# Resources
[resources]
icon=./resources/icon.png
